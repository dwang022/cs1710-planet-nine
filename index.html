<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<!-- Dark (--surface-0) from the first paint, hidden until site.js has drawn the page; shown anyway after 3s if scripts fail. -->
<style>html{background:#0f0f11}html:not([data-ready]) body{visibility:hidden;animation:p9-show 0s 3s forwards}@keyframes p9-show{to{visibility:visible}}</style>
<title>The search for Planet Nine</title>
<meta name="description" content="A guided walkthrough of the case for a ninth planet: the setting, the insight that a few dozen distant orbits lean the same way, and the search that has not yet found it. Built from real telescope catalogues." />
<link rel="icon" href="/art/svg/planet-nine.svg" type="image/svg+xml" />
</head>
<body class="intro" data-page="intro">
<!--
  The intro says as little as possible: the title, the Start button, the three
  parts as words under it (not buttons, so Start is the one way in), and the skin
  carousel on the planet itself (an arrow either side, the skin's name beneath, no
  label). Explanations belong on the pages, not here.
-->
<main class="sky">
  <div class="sky-canvas" id="skyCanvas" aria-hidden="true"></div>

  <div class="sky-scene">
    <div id="scene" role="img" aria-label="An observatory points its telescope up at Planet Nine, drawn with a question mark."></div>
    <div class="skin-pick" id="skinPick" role="group" aria-label="Choose a look for Planet Nine"></div>
  </div>

  <h1>The search for <em>Planet Nine</em></h1>

  <div class="sky-actions">
    <a class="btn-start" href="/setting/planets.html">Start <span aria-hidden="true">→</span></a>
    <nav class="parts" id="parts" aria-label="Skip to a part"></nav>
  </div>
</main>
<script type="module" src="/src/pages/intro.js"></script>
</body>
</html>
