<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<!-- Dark (--surface-0) from the first paint, hidden until site.js has drawn the page; shown anyway after 3s if scripts fail. -->
<style>html{background:#0f0f11}html:not([data-ready]) body{visibility:hidden;animation:p9-show 0s 3s forwards}@keyframes p9-show{to{visibility:visible}}</style>
<title>What else could explain it · The search for Planet Nine</title>
<meta name="description" content="A planet is not the only explanation for the aligned orbits. Each competing idea weighed by how much of the clustering it explains and what it needs, with how it deals with the stretch, the tilt and its main problem." />
<link rel="icon" href="/art/svg/planet-nine.svg" type="image/svg+xml" />
</head>
<body data-page="alternatives">
<main>
  <!-- Rebuilt on 2026-11-18 at the user's request: the page had tested four clues the reader had not met (steeply tilted
       orbits, orbits beyond Neptune's reach, nothing found yet) and its scorecard could not tell the ideas apart. Now one
       figure (charts/weigh.js): every idea placed by how much of the clustering it explains and by what it needs that
       nobody has seen, pinned on the left; on the right an introduction card, then a card per idea (built from
       alternatives.json in pages/alternatives.js), the idea being read bright and the rest dimmed. Each card: the idea's picture, how it deals with the stretch and the tilt, and its main problem. The ideas
       run from the most familiar to the least: the planet, luck, then the rest. A walkthrough testing each idea on the
       compasses came between them for a day and was cut as unnecessary. The verdicts are our reading of the papers
       (scripts/tag_alternatives.py, with page references). Every sentence names what it is about: no “it” or “their”
       without a clear noun just before. -->
  <header class="page-head wrap head-split">
    <div>
      <!-- No part/page eyebrow here on purpose: the nav says where the reader is. -->
      <h1>A planet is <em>not the only explanation</em></h1>
      <p class="lede">Astronomers have suggested other causes for the <b class="k-ev">clustering</b>, from luck to new
      physics.</p>
    </div>
    <figure class="head-fig" id="altHead"></figure>
  </header>

  <section class="part wrap" id="weigh">
    <div class="sec-head">
      <h2>What each idea needs</h2>
    </div>
    <!-- the figure pinned on the left, the cards on the right (weigh.css) -->
    <div class="scrolly wg-story" id="weighStory">
      <div class="scrolly-graphic">
        <figure class="weigh" id="weighView"></figure>
      </div>
      <div class="scrolly-steps" id="weighSteps"></div>
    </div>
  </section>
  <!-- no "So far" box (cut from every page on 2026-11-07, at the user's request): the Continue button leads on to the search -->
</main>
<script type="module" src="/src/pages/alternatives.js"></script>
</body>
</html>
